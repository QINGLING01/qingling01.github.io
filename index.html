<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1">
        <style type="text/css">
            
            div,
            /*标题*/
        	#Title{
                color: #417180;
                text-align: center;
                font-size: 80px;
                position: absolute;
            }
            /*界面UI*/
            #jump{
                background-color: gray;
                  width: 70px;
                  height: 20px;
                  color: yellow;
                  font-size: 15px;
                position: relative;
                 top:100px
            }
            
        </style>
	</head>
	<body>
        <div class="text" id="Title">Rusted War</div>
        <div class="ui" id="jump">开始游戏</div>
        <script>
        
          function jump(value) {
          	window.location.href=value;
          }
          
             var jump_value = document.querySelector("#jump")
          jump_value.onclick=function () {
             jump("Rusted War.html")
          }
       </script>
	</body>
</html>
